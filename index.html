<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>점심 메뉴 추천 AI 챗봇</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff7ed, #eef2ff);
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.08);
    }

    header {
      padding: 22px 18px 16px;
      background: linear-gradient(135deg, #ff7a18, #ffb347);
      color: white;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.3;
    }

    header p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }

    .quick-area {
      padding: 14px 14px 8px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .quick-area::-webkit-scrollbar {
      display: none;
    }

    .chip {
      border: none;
      padding: 9px 13px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #333;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .chip:hover {
      background: #ffe3c1;
    }

    .chat-box {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
    }

    .message {
      max-width: 86%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      word-break: keep-all;
    }

    .bot {
      background: #f5f5f5;
      border-top-left-radius: 6px;
      align-self: flex-start;
    }

    .user {
      background: #ff8a1f;
      color: white;
      border-top-right-radius: 6px;
      margin-left: auto;
    }

    .menu-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .menu-card {
      background: white;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
    }

    .menu-card strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      background: #fff0df;
      color: #c45a00;
      padding: 4px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 13px;
      color: #555;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
      background: #fff;
    }

    input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 13px 15px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ff8a1f;
    }

    .send-btn {
      border: none;
      border-radius: 999px;
      padding: 0 18px;
      background: #ff8a1f;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .send-btn:hover {
      background: #e76f00;
    }

    .small-guide {
      font-size: 12px;
      color: #777;
      padding: 0 16px 12px;
      text-align: center;
    }

    @media (min-width: 600px) {
      body {
        padding: 24px 0;
      }

      .app {
        min-height: 88vh;
        border-radius: 28px;
        overflow: hidden;
      }

      .menu-list {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>점심 메뉴 추천 AI 챗봇</h1>
      <p>“점심때 뭐먹지?”라고 물어보면 한식, 중식, 일식 메뉴를 추천합니다.</p>
    </header>

    <section class="quick-area">
      <button class="chip" onclick="quickAsk('점심때 뭐먹지')">점심 추천</button>
      <button class="chip" onclick="quickAsk('한식 추천해줘')">한식</button>
      <button class="chip" onclick="quickAsk('중식 추천해줘')">중식</button>
      <button class="chip" onclick="quickAsk('일식 추천해줘')">일식</button>
      <button class="chip" onclick="quickAsk('매운 음식 추천해줘')">매운 음식</button>
      <button class="chip" onclick="quickAsk('가벼운 음식 추천해줘')">가벼운 음식</button>
      <button class="chip" onclick="quickAsk('전체 메뉴 보여줘')">전체 메뉴</button>
    </section>

    <section id="chatBox" class="chat-box">
      <div class="message bot">
        안녕하세요. 저는 점심 메뉴 추천 챗봇입니다.<br>
        예: 점심때 뭐먹지, 한식 추천해줘, 매운 음식 추천해줘
      </div>
    </section>

    <section class="input-area">
      <input id="userInput" type="text" placeholder="점심때 뭐먹지?" onkeydown="handleEnter(event)" />
      <button class="send-btn" onclick="sendMessage()">전송</button>
    </section>

    <div class="small-guide">
      모바일 화면에 맞춘 반응형 웹입니다. HTML 파일 하나로 실행됩니다.
    </div>
  </main>

  <script>
    const menus = [
      // 한식 20개
      { name: "김치찌개", category: "한식", type: "매운 음식", desc: "칼칼하고 든든한 대표 점심 메뉴입니다." },
      { name: "된장찌개", category: "한식", type: "든든한 음식", desc: "구수하고 부담 없는 한식 메뉴입니다." },
      { name: "비빔밥", category: "한식", type: "가벼운 음식", desc: "채소와 밥을 함께 먹기 좋은 균형 잡힌 메뉴입니다." },
      { name: "불고기 백반", category: "한식", type: "든든한 음식", desc: "고기와 반찬을 함께 먹을 수 있는 안정적인 선택입니다." },
      { name: "제육볶음", category: "한식", type: "매운 음식", desc: "매콤하고 밥이 잘 넘어가는 인기 메뉴입니다." },
      { name: "순두부찌개", category: "한식", type: "매운 음식", desc: "부드러운 순두부와 얼큰한 국물이 좋습니다." },
      { name: "갈비탕", category: "한식", type: "든든한 음식", desc: "국물과 고기를 함께 먹는 보양식 느낌의 메뉴입니다." },
      { name: "설렁탕", category: "한식", type: "담백한 음식", desc: "담백하고 속 편한 국밥류 메뉴입니다." },
      { name: "부대찌개", category: "한식", type: "매운 음식", desc: "햄, 라면, 찌개를 함께 즐길 수 있습니다." },
      { name: "감자탕", category: "한식", type: "든든한 음식", desc: "진한 국물과 고기가 들어간 든든한 메뉴입니다." },
      { name: "콩나물국밥", category: "한식", type: "가벼운 음식", desc: "시원하고 부담이 적어 점심에 좋습니다." },
      { name: "육개장", category: "한식", type: "매운 음식", desc: "얼큰한 국물이 생각날 때 좋습니다." },
      { name: "닭갈비", category: "한식", type: "매운 음식", desc: "매콤한 양념과 볶음밥까지 즐길 수 있습니다." },
      { name: "쌈밥", category: "한식", type: "건강한 음식", desc: "채소를 많이 먹고 싶을 때 좋은 메뉴입니다." },
      { name: "보쌈정식", category: "한식", type: "든든한 음식", desc: "고기와 김치를 함께 먹는 만족도 높은 메뉴입니다." },
      { name: "칼국수", category: "한식", type: "담백한 음식", desc: "따뜻한 국물과 면이 먹고 싶을 때 좋습니다." },
      { name: "냉면", category: "한식", type: "가벼운 음식", desc: "시원하고 깔끔한 점심 메뉴입니다." },
      { name: "김밥", category: "한식", type: "가벼운 음식", desc: "간단하고 빠르게 먹기 좋은 메뉴입니다." },
      { name: "떡볶이", category: "한식", type: "매운 음식", desc: "분식이 당길 때 좋은 선택입니다." },
      { name: "오징어볶음", category: "한식", type: "매운 음식", desc: "매콤한 양념과 밥 조합이 좋습니다." },

      // 중식 15개
      { name: "짜장면", category: "중식", type: "가벼운 음식", desc: "빠르고 무난한 중식 대표 메뉴입니다." },
      { name: "짬뽕", category: "중식", type: "매운 음식", desc: "얼큰한 국물과 해산물이 생각날 때 좋습니다." },
      { name: "탕수육", category: "중식", type: "든든한 음식", desc: "여럿이 함께 먹기 좋은 메뉴입니다." },
      { name: "볶음밥", category: "중식", type: "가벼운 음식", desc: "간단하지만 포만감 있는 중식 메뉴입니다." },
      { name: "마파두부덮밥", category: "중식", type: "매운 음식", desc: "매콤한 두부 소스와 밥의 조합이 좋습니다." },
      { name: "고추잡채밥", category: "중식", type: "매운 음식", desc: "매콤한 고기와 채소를 밥과 함께 먹습니다." },
      { name: "잡채밥", category: "중식", type: "든든한 음식", desc: "부드러운 당면과 밥이 잘 어울립니다." },
      { name: "유산슬밥", category: "중식", type: "담백한 음식", desc: "부드럽고 고급스러운 느낌의 중식 덮밥입니다." },
      { name: "깐풍기", category: "중식", type: "든든한 음식", desc: "바삭하고 매콤달콤한 닭요리입니다." },
      { name: "라조기", category: "중식", type: "매운 음식", desc: "매콤한 닭요리가 먹고 싶을 때 좋습니다." },
      { name: "양장피", category: "중식", type: "가벼운 음식", desc: "여러 재료를 곁들여 먹는 중식 메뉴입니다." },
      { name: "우육면", category: "중식", type: "든든한 음식", desc: "진한 고기 국물의 면 요리입니다." },
      { name: "멘보샤", category: "중식", type: "간식형 음식", desc: "바삭한 새우 토스트 느낌의 메뉴입니다." },
      { name: "군만두", category: "중식", type: "가벼운 음식", desc: "짜장면이나 짬뽕과 함께 먹기 좋습니다." },
      { name: "해물누룽지탕", category: "중식", type: "담백한 음식", desc: "따뜻하고 고소한 국물 요리입니다." },

      // 일식 15개
      { name: "초밥", category: "일식", type: "가벼운 음식", desc: "깔끔하고 산뜻한 점심 메뉴입니다." },
      { name: "돈카츠", category: "일식", type: "든든한 음식", desc: "바삭한 튀김과 밥을 함께 먹는 인기 메뉴입니다." },
      { name: "라멘", category: "일식", type: "든든한 음식", desc: "진한 국물과 면이 당길 때 좋습니다." },
      { name: "우동", category: "일식", type: "담백한 음식", desc: "부드러운 면과 따뜻한 국물이 좋습니다." },
      { name: "규동", category: "일식", type: "든든한 음식", desc: "소고기 덮밥으로 빠르고 든든합니다." },
      { name: "가츠동", category: "일식", type: "든든한 음식", desc: "돈카츠와 계란이 올라간 덮밥입니다." },
      { name: "오야코동", category: "일식", type: "담백한 음식", desc: "닭고기와 계란이 들어간 부드러운 덮밥입니다." },
      { name: "카레라이스", category: "일식", type: "든든한 음식", desc: "일본식 카레가 밥과 잘 어울립니다." },
      { name: "텐동", category: "일식", type: "든든한 음식", desc: "튀김이 올라간 일식 덮밥입니다." },
      { name: "소바", category: "일식", type: "가벼운 음식", desc: "시원하거나 담백하게 먹기 좋은 면 요리입니다." },
      { name: "사케동", category: "일식", type: "가벼운 음식", desc: "연어를 좋아한다면 만족도가 높은 메뉴입니다." },
      { name: "스키야키 정식", category: "일식", type: "든든한 음식", desc: "달짝지근한 국물과 고기를 함께 즐깁니다." },
      { name: "오코노미야키", category: "일식", type: "든든한 음식", desc: "철판 요리 느낌의 특별한 점심 메뉴입니다." },
      { name: "야키소바", category: "일식", type: "가벼운 음식", desc: "볶음면이 당길 때 좋은 메뉴입니다." },
      { name: "회덮밥", category: "일식", type: "가벼운 음식", desc: "신선한 회와 채소를 밥과 함께 먹습니다." }
    ];

    const chatBox = document.getElementById("chatBox");
    const input = document.getElementById("userInput");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `message ${sender}`;
      div.innerHTML = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function menuCards(list) {
      return `
        <div class="menu-list">
          ${list.map(menu => `
            <div class="menu-card">
              <span class="tag">${menu.category} · ${menu.type}</span>
              <strong>${menu.name}</strong>
              <div class="desc">${menu.desc}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function recommendByCategory(category) {
      const filtered = menus.filter(menu => menu.category === category);
      return shuffle(filtered).slice(0, 5);
    }

    function recommendByType(typeKeyword) {
      const filtered = menus.filter(menu => menu.type.includes(typeKeyword));
      return shuffle(filtered).slice(0, 5);
    }

    function recommendRandom() {
      return shuffle(menus).slice(0, 5);
    }

    function getBotReply(userText) {
      const text = userText.replace(/\s/g, "");

      if (text.includes("전체") || text.includes("50개") || text.includes("모두")) {
        return `전체 메뉴 50개입니다.${menuCards(menus)}`;
      }

      if (text.includes("한식")) {
        const result = recommendByCategory("한식");
        return `한식으로는 이 메뉴들이 좋습니다.${menuCards(result)}`;
      }

      if (text.includes("중식") || text.includes("중국")) {
        const result = recommendByCategory("중식");
        return `중식으로는 이 메뉴들이 좋습니다.${menuCards(result)}`;
      }

      if (text.includes("일식") || text.includes("일본")) {
        const result = recommendByCategory("일식");
        return `일식으로는 이 메뉴들이 좋습니다.${menuCards(result)}`;
      }

      if (text.includes("매운") || text.includes("맵")) {
        const result = recommendByType("매운");
        return `매운 음식이 당기신다면 이 메뉴가 좋습니다.${menuCards(result)}`;
      }

      if (text.includes("가벼운") || text.includes("간단") || text.includes("부담")) {
        const result = recommendByType("가벼운");
        return `가볍게 드시려면 이 메뉴가 좋습니다.${menuCards(result)}`;
      }

      if (
        text.includes("점심") ||
        text.includes("뭐먹") ||
        text.includes("메뉴") ||
        text.includes("추천") ||
        text.includes("배고")
      ) {
        const result = recommendRandom();
        return `오늘 점심은 이 중에서 골라보세요.${menuCards(result)}`;
      }

      return `
        이렇게 질문해 보세요.<br><br>
        · 점심때 뭐먹지<br>
        · 한식 추천해줘<br>
        · 중식 추천해줘<br>
        · 일식 추천해줘<br>
        · 매운 음식 추천해줘<br>
        · 전체 메뉴 보여줘
      `;
    }

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      setTimeout(() => {
        const reply = getBotReply(text);
        addMessage(reply, "bot");
      }, 300);
    }

    function quickAsk(text) {
      input.value = text;
      sendMessage();
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>
</body>
</html>
